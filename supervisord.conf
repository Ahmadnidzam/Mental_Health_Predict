; Supervisor menjalankan Apache + Laravel queue worker dalam satu container.
; Worker dibutuhkan agar RetrainModelsJob (queue=database) benar-benar dieksekusi.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
; timeout (610) harus > RetrainModelsJob::$timeout (600) agar job tidak dibunuh worker.
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --timeout=610 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=620
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
